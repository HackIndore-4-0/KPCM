<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="50%" stop-color="#090c16"/>
      <stop offset="100%" stop-color="#0d0f1c"/>
    </linearGradient>

    <!-- Neon Rim Gradient -->
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b026ff" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Shield Primary Gradient -->
    <linearGradient id="shieldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="45%" stop-color="#00a8ff"/>
      <stop offset="100%" stop-color="#b026ff"/>
    </linearGradient>

    <!-- Shield Reverse Gradient for dynamic depth -->
    <linearGradient id="shieldReverse" x1="80%" y1="0%" x2="20%" y2="100%">
      <stop offset="0%" stop-color="#b026ff"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Center Glow -->
    <radialGradient id="cyanCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#00f0ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b026ff" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#7000ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#b026ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Base with Deep Fintech Obsidian Fill -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)"/>
  
  <!-- Subtle Dot Grid Texture inside squircle -->
  <g opacity="0.08" fill="#00f0ff">
    <circle cx="80" cy="80" r="2"/><circle cx="120" cy="80" r="2"/><circle cx="160" cy="80" r="2"/><circle cx="200" cy="80" r="2"/><circle cx="240" cy="80" r="2"/><circle cx="280" cy="80" r="2"/><circle cx="320" cy="80" r="2"/><circle cx="360" cy="80" r="2"/><circle cx="400" cy="80" r="2"/><circle cx="440" cy="80" r="2"/>
    <circle cx="80" cy="120" r="2"/><circle cx="120" cy="120" r="2"/><circle cx="400" cy="120" r="2"/><circle cx="440" cy="120" r="2"/>
    <circle cx="80" cy="400" r="2"/><circle cx="120" cy="400" r="2"/><circle cx="400" cy="400" r="2"/><circle cx="440" cy="400" r="2"/>
    <circle cx="80" cy="440" r="2"/><circle cx="120" cy="440" r="2"/><circle cx="160" cy="440" r="2"/><circle cx="200" cy="440" r="2"/><circle cx="240" cy="440" r="2"/><circle cx="280" cy="440" r="2"/><circle cx="320" cy="440" r="2"/><circle cx="360" cy="440" r="2"/><circle cx="400" cy="440" r="2"/><circle cx="440" cy="440" r="2"/>
  </g>

  <!-- Ambient Light Halos -->
  <circle cx="180" cy="170" r="150" fill="url(#cyanCoreGlow)"/>
  <circle cx="330" cy="330" r="160" fill="url(#violetCoreGlow)"/>

  <!-- Outer Neon Rim -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="url(#neonRim)" stroke-width="4" opacity="0.85"/>

  <!-- Inner Concentric Circuit Ring (representing NPCI/Bank Rails) -->
  <rect x="42" y="42" width="428" height="428" rx="88" fill="none" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1.5" stroke-dasharray="16 8"/>

  <!-- CORE FINTECH INSIGNIA: Dynamic Protective Shield & Consensus Loops -->
  <g filter="url(#neonGlow)">
    <!-- Outer Shield Silhouette Line -->
    <path d="M 256 86 
             C 340 86, 396 110, 404 186 
             C 404 290, 320 380, 256 426 
             C 192 380, 108 290, 108 186 
             C 116 110, 172 86, 256 86 Z" 
          fill="none" 
          stroke="url(#shieldGrad)" 
          stroke-width="5" 
          stroke-linejoin="round"/>
  </g>

  <!-- Inner Shield Shading Glass Fill -->
  <path d="M 256 98 
           C 330 98, 382 120, 390 188 
           C 390 280, 316 362, 256 408 
           C 196 362, 122 280, 122 188 
           C 130 120, 182 98, 256 98 Z" 
        fill="rgba(10, 14, 28, 0.65)" 
        stroke="rgba(0, 240, 255, 0.25)" 
        stroke-width="2"/>

  <!-- Dynamic Multi-Ledger Reconciliation Interlocking Loops (Currency Consensus Swirl) -->
  <!-- Upper Left to Center-Right Loop (Bank CBS to Switch) -->
  <path d="M 180 210
           C 180 160, 240 144, 280 172
           C 310 192, 332 236, 342 278
           C 348 304, 326 322, 298 316
           C 272 310, 260 286, 248 262
           C 236 238, 214 210, 180 210 Z"
        fill="url(#shieldGrad)"
        opacity="0.85"/>

  <!-- Lower Right to Center-Left Loop (Switch to Merchant PG) -->
  <path d="M 332 302
           C 332 352, 272 368, 232 340
           C 202 320, 180 276, 170 234
           C 164 208, 186 190, 214 196
           C 240 202, 252 226, 264 250
           C 276 274, 298 302, 332 302 Z"
        fill="url(#shieldReverse)"
        opacity="0.85"/>

  <!-- High-Precision Digital Circuit Connectors & Ledger Node Pins -->
  <!-- Top Node: Bank CBS (Emerald accent) -->
  <g filter="url(#subtleGlow)">
    <line x1="256" y1="98" x2="256" y2="152" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4 3"/>
    <circle cx="256" cy="152" r="6" fill="#10b981"/>
    <circle cx="256" cy="152" r="11" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Left Node: NPCI Switch (Cyan accent) -->
  <g filter="url(#subtleGlow)">
    <line x1="140" y1="210" x2="180" y2="210" stroke="#00f0ff" stroke-width="2.5"/>
    <circle cx="140" cy="210" r="5" fill="#00f0ff"/>
  </g>

  <!-- Right Node: Merchant PG (Amber accent) -->
  <g filter="url(#subtleGlow)">
    <line x1="372" y1="302" x2="332" y2="302" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="372" cy="302" r="5" fill="#f59e0b"/>
  </g>

  <!-- Center Consensus Engine Nexus (Brilliant Diamond / Star Core) -->
  <g filter="url(#neonGlow)">
    <polygon points="256,228 274,256 256,284 238,256" fill="#ffffff"/>
    <polygon points="256,236 268,256 256,276 244,256" fill="#00f0ff"/>
    <circle cx="256" cy="256" r="3" fill="#ffffff"/>
  </g>

  <!-- Horizontal Statutory Balance Beam (Subtle reference to Ombudsman Scales of Justice) -->
  <path d="M 216 366 L 296 366" stroke="url(#shieldGrad)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="216" cy="366" r="4" fill="#00f0ff"/>
  <circle cx="296" cy="366" r="4" fill="#b026ff"/>
  <circle cx="256" cy="366" r="5" fill="#ffffff"/>

  <!-- Top Glass Highlight Arc -->
  <path d="M 140 160 C 180 122, 230 110, 280 110 C 330 110, 360 122, 380 144" 
        fill="none" 
        stroke="rgba(255, 255, 255, 0.4)" 
        stroke-width="2.5" 
        stroke-linecap="round"/>
</svg>
