[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "finresolve-backend"
version = "0.1.0"
description = "Autonomous Resolution Agent for Complex Financial Grievances"
authors = [{ name = "KPCM Team" }]
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "pydantic>=2.6.0",
    "supabase>=2.3.0",
    "google-genai>=0.1.1",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
    "sse-starlette>=2.0.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
